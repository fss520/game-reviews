const screen_el = document.getElementById('screen');
const bgA = document.getElementById('bgA'), bgB = document.getElementById('bgB');
const vid = document.getElementById('vid');
const crumbs_el = document.getElementById('crumbs');
const infoPanel = document.getElementById('infoPanel');
const animBtn = document.getElementById('animBtn');
const infoBtn = document.getElementById('infoBtn');
const moneyBtn = document.getElementById('moneyBtn');
let cur = DATA.home, trail = [DATA.home], showingA = true, moneyOn = true;

function scr(id){ return DATA.screens[id]; }
function show(id, push){
  const s = scr(id); if(!s) return;
  cur = id;
  if(push){ trail.push(id); } 
  const inEl = showingA ? bgB : bgA, outEl = showingA ? bgA : bgB;
  inEl.src = s.img;
  inEl.onload = () => { inEl.classList.add('on'); outEl.classList.remove('on'); };
  if(inEl.complete && inEl.naturalWidth) { inEl.classList.add('on'); outEl.classList.remove('on'); }
  showingA = !showingA;
  vid.pause(); vid.style.display='none'; animBtn.classList.remove('on');
  renderEdges(); renderCrumbs(); renderInfo();
  location.hash = id;
}
function renderEdges(){
  screen_el.querySelectorAll('.hs').forEach(e=>e.remove());
  const s = scr(cur);
  (s.edges||[]).forEach(e=>{
    const d = document.createElement('div');
    const w = e.w || 96, h = e.h || 64;
    d.className = 'hs ' + (e.money ? 'money' : e.unrec ? 'unrec' : 'nav');
    if(e.money && !moneyOn) d.style.display='none';
    d.style.left = (e.x/561*100)+'%';
    d.style.top = (e.y/1040*100)+'%';
    d.style.width = (w/561*100)+'%';
    d.style.height = (h/1040*100)+'%';
    d.title = e.unrec ? (e.label+'（'+e.unrec+'）') : e.label;
    const tag = document.createElement('span');
    tag.className='tag'; tag.textContent = e.unrec ? e.label+' 🔒' : e.label;
    d.appendChild(tag);
    d.onclick = (ev)=>{ ev.stopPropagation();
      if(e.to && scr(e.to)) show(e.to, true);
    };
    screen_el.appendChild(d);
  });
}
function renderCrumbs(){
  const names = trail.map(id=>scr(id)?scr(id).label:id);
  let html = '';
  trail.forEach((id,i)=>{
    const nm = scr(id)?scr(id).label:id;
    if(i===trail.length-1) html += '<b>'+nm+'</b>';
    else html += '<span data-i="'+i+'">'+nm+'</span> › ';
  });
  crumbs_el.innerHTML = html;
  crumbs_el.querySelectorAll('span').forEach(sp=>{
    sp.onclick = ()=>{ const i=+sp.dataset.i; const target=trail[i]; trail=trail.slice(0,i+1); show(target,false); };
  });
}
function renderInfo(){
  const s = scr(cur);
  infoPanel.textContent = s.label + '\n窗口：' + (DATA.windows[s.window]?DATA.windows[s.window].title:s.window) + '\n' + (s.text||'');
}
animBtn.onclick = ()=>{
  const s = scr(cur);
  if(!s.video) return;
  if(vid.style.display==='none' || !vid.style.display){
    vid.src = s.video; vid.style.display='block'; vid.play(); animBtn.classList.add('on');
  } else { vid.pause(); vid.style.display='none'; animBtn.classList.remove('on'); }
};
infoBtn.onclick = ()=>{ infoPanel.classList.toggle('on'); infoBtn.classList.toggle('on'); };
moneyBtn.onclick = ()=>{ moneyOn=!moneyOn; moneyBtn.classList.toggle('money-on', moneyOn); renderEdges(); };
document.getElementById('homeBtn').onclick = ()=>{ trail=[DATA.home]; show(DATA.home,false); };
document.getElementById('meta').textContent = DATA.generated + ' 实机采集 · ' + Object.keys(DATA.screens).length + ' 界面';
const start = location.hash ? location.hash.slice(1) : DATA.home;
show(scr(start)?start:DATA.home, false);
